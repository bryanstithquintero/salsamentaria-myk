<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — Salsamentaria MYK</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <div class="page">

      <!-- Cabecera -->
      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">Productos</h1>
          <p class="page-subtitle" id="prod-subtitle">Cargando inventario…</p>
        </div>
        <div class="page-actions">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Buscar por nombre o código…" oninput="applyFilters()">
          </div>
          <button class="btn btn-outline btn-sm" onclick="exportCSV()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Exportar CSV
          </button>
          <a href="./nuevo-producto.html" class="btn btn-primary btn-sm">+ Nuevo producto</a>
        </div>
      </div>

      <!-- Tabla de productos -->
      <div class="panel">
        <!-- Filtros -->
        <div class="panel-body" style="padding-bottom:0">
          <div class="filter-bar">
            <div class="filter-tabs" id="cat-tabs">
              <button class="filter-tab active" data-cat="Todos" onclick="setCategory(this)">
                Todos <span class="ftab-count" id="cnt-todos">—</span>
              </button>
              <button class="filter-tab" data-cat="Cárnicos" onclick="setCategory(this)">
                🥩 Cárnicos <span class="ftab-count" id="cnt-carnicos">—</span>
              </button>
              <button class="filter-tab" data-cat="Lácteos" onclick="setCategory(this)">
                🧀 Lácteos <span class="ftab-count" id="cnt-lacteos">—</span>
              </button>
              <button class="filter-tab" data-cat="Otros" onclick="setCategory(this)">
                📦 Otros <span class="ftab-count" id="cnt-otros">—</span>
              </button>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:12px;color:var(--text-muted)">Ordenar:</span>
              <select id="sort-select" class="form-select" style="width:auto;padding:5px 28px 5px 10px;font-size:12px" onchange="applyFilters()">
                <option value="stock-asc">Existencias ↑</option>
                <option value="stock-desc">Existencias ↓</option>
                <option value="name-asc">Nombre A-Z</option>
                <option value="price-desc">Precio ↓</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Tabla -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:36px"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
                <th>Código</th>
                <th>Producto</th>
                <th>Presentación</th>
                <th class="text-center">Existencias</th>
                <th>P. Compra</th>
                <th>P. Venta</th>
                <th>Estado</th>
                <th style="width:80px"></th>
              </tr>
            </thead>
            <tbody id="products-tbody">
              <!-- Generado por JS -->
            </tbody>
          </table>
        </div>

        <!-- Paginación -->
        <div class="pagination">
          <span class="pg-info" id="pg-info">—</span>
          <div class="pg-btns" id="pg-btns"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal confirmación eliminación -->
<div id="confirm-modal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center">
  <div style="background:var(--surface);border-radius:var(--rl);padding:28px;max-width:380px;width:90%;box-shadow:var(--shd)">
    <h3 style="font-size:16px;margin-bottom:8px">¿Eliminar producto?</h3>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:20px" id="confirm-msg">Esta acción no se puede deshacer.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-btn">Eliminar</button>
    </div>
  </div>
</div>

<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
<script src="./js/productos.js"></script>
</body>
</html>
